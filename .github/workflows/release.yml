name: Release Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          LIENE_KEYSTORE_BASE64: ${{ secrets.LIENE_KEYSTORE_BASE64 }}
          LIENE_KEYSTORE_PASSWORD: ${{ secrets.LIENE_KEYSTORE_PASSWORD }}
          LIENE_KEY_ALIAS: ${{ secrets.LIENE_KEY_ALIAS }}
          LIENE_KEY_PASSWORD: ${{ secrets.LIENE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi

          if [[ -n "${LIENE_KEYSTORE_BASE64}" ]]; then
            echo "$LIENE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liene.jks"
            export LIENE_KEYSTORE_PATH="$RUNNER_TEMP/liene.jks"
            echo "LIENE_KEYSTORE_PATH=$RUNNER_TEMP/liene.jks" >> "$GITHUB_ENV"
          fi

          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="$version" \
            -PappVersionCode="${GITHUB_RUN_NUMBER}"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/Liene-Android-${version}.apk"
          (cd dist && for f in Liene-Android-*.apk; do sha256sum "$f" > "$f.sha256"; done)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: liene-android-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Liene-Android-*.apk
            dist/Liene-Android-*.apk.sha256
          fail_on_unmatched_files: true
          body: |
            ## Liene Android App ${{ github.ref_name }}

            **APK for Android 8+** — sideload with unknown sources enabled.
            The app is signed with a debug key unless release signing secrets
            are configured; it is not a Play Store build.

            Pair the printer in Android's Bluetooth settings, open the app,
            grant Nearby devices access, then share a photo from any gallery
            app to **Liene** (or choose one in the app) and print.

            **Status:** the protocol is hardware-tested on the N200 Pro via
            the desktop client, but this Android print path still needs
            hardware confirmation. Please report model, PID, firmware,
            Android version/device, and a Diagnostics log.
