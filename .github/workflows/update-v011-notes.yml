name: Update v0.1.1 release notes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-v011-notes.yml

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Update release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          ## Liene Android App v0.1.1

          **APK for Android 8+** — sideload with unknown sources enabled.
          The app is signed with a debug key unless release signing secrets
          are configured; it is not a Play Store build.

          Pair the printer in Android's Bluetooth settings, open the app,
          grant Nearby devices access, then share a photo from any gallery
          app to **Liene** (or choose one in the app) and print.

          **What's new**

          - Final 2:3 preview and confirmation before a job starts.
          - Fixed 1200×1800 output; the quality selector is gone.
          - Correct 0–4 battery levels (`Battery full`, `75%`, …).
          - Rotation/framing/zoom survive light/dark theme changes.
          - Launcher icon based on the desktop app artwork.

          **Status:** hardware-tested on the N200 Pro (DMP130) with a Pixel
          11 Pro on Android 17 — share, connect, status, and printing work.
          Other Liene/Hannto models remain untested. Please report model,
          PID, firmware, Android version/device, and a Diagnostics log.
          EOF
          gh release edit v0.1.1 --repo "$GH_REPO" --notes-file notes.md
